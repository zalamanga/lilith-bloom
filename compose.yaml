services:
  web:
    build: .
    mem_limit: 512m
    ports:
      - "127.0.0.1:${APP_PORT:-18096}:8080"
    environment:
      JAVA_OPTS: -Xms64m -Xmx320m
      DB_URL: jdbc:mysql://db:3306/lilith_bloom?serverTimezone=UTC
      DB_USER: lilith
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD pada .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    mem_limit: 512m
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=30
    environment:
      MYSQL_DATABASE: lilith_bloom
      MYSQL_USER: lilith
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD pada .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - lilith-data:/var/lib/mysql
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  lilith-data:
